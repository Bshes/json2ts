<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 Encode Decode - DevForge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #30363d; }
  .logo { font-size: 24px; font-weight: 700; color: #58a6ff; }
  .logo span { color: #f0f6fc; }
  .back-link { color: #58a6ff; text-decoration: none; font-size: 13px; display: flex; align-items: center; gap: 4px; }
  .back-link:hover { text-decoration: underline; }
  .pro-badge { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; margin-top: 20px; }
  .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #1c2128; border-bottom: 1px solid #30363d; font-size: 14px; font-weight: 600; }
  .panel-header .actions { display: flex; gap: 8px; }
  textarea { width: 100%; height: 200px; background: transparent; border: none; color: #c9d1d9; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; padding: 16px; resize: vertical; outline: none; }
  textarea::placeholder { color: #484f58; }
  .btn { padding: 6px 16px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; cursor: pointer; font-size: 13px; transition: all .2s; }
  .btn:hover { background: #30363d; }
  .btn-primary { background: #238636; border-color: #2ea043; color: #fff; }
  .btn-primary:hover { background: #2ea043; }
  .btn-encode { background: #1f6feb; border-color: #388bfd; color: #fff; }
  .btn-encode:hover { background: #388bfd; }
  .btn-decode { background: #9e6a03; border-color: #d29922; color: #fff; }
  .btn-decode:hover { background: #bb8009; }
  .tab-bar { display: flex; gap: 0; padding: 8px 16px; background: #1c2128; border-bottom: 1px solid #30363d; }
  .tab { padding: 8px 24px; border: 1px solid #30363d; background: #161b22; color: #8b949e; cursor: pointer; font-size: 13px; }
  .tab:first-child { border-radius: 4px 0 0 4px; }
  .tab:last-child { border-radius: 0 4px 4px 0; }
  .tab.active { background: #238636; color: #fff; border-color: #2ea043; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #238636; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .3s; z-index: 100; }
  .toast.show { opacity: 1; }
  .toast.error { background: #da3633; }
  .footer { text-align: center; padding: 32px 0; color: #484f58; font-size: 13px; }
  .footer a { color: #58a6ff; text-decoration: none; }
  .action-buttons { display: flex; gap: 8px; padding: 8px 16px; background: #1c2128; border-bottom: 1px solid #30363d; }
</style>
</head>
<body>
<div class="container">
  <header>
    <a href="../" class="back-link">← DevForge</a>
    <div class="logo">Base64 <span>Encoder</span></div>
    <span class="pro-badge">Free</span>
  </header>

  <div class="panel">
    <div class="panel-header">
      <span>Input</span>
      <div class="actions">
        <button class="btn" onclick="document.getElementById('input').value=''">Clear</button>
      </div>
    </div>
    <div class="tab-bar">
      <div class="tab active" id="tabEncode" onclick="switchTab('encode')">Encode</div>
      <div class="tab" id="tabDecode" onclick="switchTab('decode')">Decode</div>
    </div>
    <textarea id="input" placeholder='Type or paste text to encode...' spellcheck="false">Hello, DevForge!</textarea>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span>Output</span>
      <div class="actions">
        <button class="btn" onclick="copyOutput()">Copy</button>
        <button class="btn btn-encode" id="actionBtn" onclick="doConvert()">Encode →</button>
      </div>
    </div>
    <textarea id="output" placeholder="Output will appear here..." readonly style="height:200px;cursor:default"></textarea>
  </div>

  <div class="footer">
    Built by <a href="https://dev.to/bshes">@Bshes</a> &mdash; <a href="../">All DevForge tools</a>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let mode = 'encode';

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function switchTab(tab) {
  mode = tab;
  document.getElementById('tabEncode').className = 'tab' + (tab === 'encode' ? ' active' : '');
  document.getElementById('tabDecode').className = 'tab' + (tab === 'decode' ? ' active' : '');
  document.getElementById('actionBtn').textContent = tab === 'encode' ? 'Encode →' : 'Decode →';
  document.getElementById('actionBtn').className = 'btn ' + (tab === 'encode' ? 'btn-encode' : 'btn-decode');
  document.getElementById('input').placeholder = tab === 'encode' ? 'Type or paste text to encode...' : 'Paste Base64 string to decode...';
  document.getElementById('output').value = '';
}

function doConvert() {
  const input = document.getElementById('input').value;
  const output = document.getElementById('output');
  if (!input) { showToast('Please enter some text', true); return; }
  try {
    if (mode === 'encode') {
      output.value = btoa(unescape(encodeURIComponent(input)));
      showToast('Encoded successfully');
    } else {
      output.value = decodeURIComponent(escape(atob(input.trim())));
      showToast('Decoded successfully');
    }
  } catch (e) {
    output.value = 'Error: ' + e.message;
    showToast('Conversion error', true);
  }
}

function copyOutput() {
  const text = document.getElementById('output').value;
  if (!text) { showToast('Nothing to copy', true); return; }
  navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    showToast('Copied to clipboard');
  });
}
</script>
</body>
</html>
