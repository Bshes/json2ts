<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diff Checker - DevForge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
  .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #30363d; }
  .logo { font-size: 24px; font-weight: 700; color: #58a6ff; }
  .logo span { color: #f0f6fc; }
  .back-link { color: #58a6ff; text-decoration: none; font-size: 13px; display: flex; align-items: center; gap: 4px; }
  .back-link:hover { text-decoration: underline; }
  .pro-badge { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 768px) { .diff-grid { grid-template-columns: 1fr; } }
  .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
  .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #1c2128; border-bottom: 1px solid #30363d; font-size: 14px; font-weight: 600; }
  .panel-header .actions { display: flex; gap: 8px; }
  .panel-header .badge { font-size: 11px; color: #8b949e; font-weight: 400; }
  textarea { width: 100%; height: 300px; background: transparent; border: none; color: #c9d1d9; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; padding: 16px; resize: vertical; outline: none; }
  textarea::placeholder { color: #484f58; }
  .btn { padding: 6px 16px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; cursor: pointer; font-size: 13px; transition: all .2s; }
  .btn:hover { background: #30363d; }
  .btn-primary { background: #238636; border-color: #2ea043; color: #fff; }
  .btn-primary:hover { background: #2ea043; }
  .diff-output { margin-top: 20px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
  .diff-output .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #1c2128; border-bottom: 1px solid #30363d; font-size: 14px; font-weight: 600; }
  .diff-lines { padding: 0; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; line-height: 1.6; }
  .diff-line { display: flex; padding: 0 16px; }
  .diff-line .ln { width: 40px; text-align: right; padding-right: 12px; color: #484f58; user-select: none; }
  .diff-line .content { flex: 1; white-space: pre-wrap; }
  .diff-line.added { background: #23863622; }
  .diff-line.added .ln { color: #3fb950; }
  .diff-line.removed { background: #da363322; }
  .diff-line.removed .ln { color: #f85149; }
  .diff-line.unchanged { background: transparent; }
  .stats { display: flex; gap: 16px; padding: 12px 16px; background: #0d1117; border-top: 1px solid #30363d; font-size: 12px; }
  .stats .added { color: #3fb950; }
  .stats .removed { color: #f85149; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #238636; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .3s; z-index: 100; }
  .toast.show { opacity: 1; }
  .toast.error { background: #da3633; }
  .footer { text-align: center; padding: 32px 0; color: #484f58; font-size: 13px; }
  .footer a { color: #58a6ff; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <a href="../" class="back-link">← DevForge</a>
    <div class="logo">Diff <span>Checker</span></div>
    <span class="pro-badge">Free</span>
  </header>

  <div class="diff-grid">
    <div class="panel">
      <div class="panel-header">
        <span>Original</span>
        <div class="actions">
          <button class="btn" onclick="document.getElementById('inputA').value=samples.a;compare()">Sample</button>
        </div>
      </div>
      <textarea id="inputA" placeholder="Original text..." spellcheck="false"></textarea>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span>Changed</span>
        <div class="actions">
          <button class="btn" onclick="document.getElementById('inputB').value=samples.b;compare()">Sample</button>
        </div>
      </div>
      <textarea id="inputB" placeholder="Changed text..." spellcheck="false"></textarea>
    </div>
  </div>

  <div style="display:flex;gap:8px;justify-content:center;margin-top:12px">
    <button class="btn btn-primary" onclick="compare()">Compare</button>
    <button class="btn" onclick="clearAll()">Clear</button>
  </div>

  <div class="diff-output" id="diffOutput" style="display:none">
    <div class="header">
      <span>Differences</span>
      <div class="actions">
        <button class="btn" onclick="copyDiff()">Copy Diff</button>
      </div>
    </div>
    <div class="diff-lines" id="diffLines"></div>
    <div class="stats" id="diffStats"></div>
  </div>

  <div class="footer">
    Built by <a href="https://dev.to/bshes">@Bshes</a> &mdash; <a href="../">All DevForge tools</a>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const samples = {
  a: `function greet(name) {
  return "Hello, " + name;
}

function add(a, b) {
  return a + b;
}

const PI = 3.14;`,
  b: `function greet(name) {
  return "Hi, " + name + "!";
}

function add(a, b) {
  return a + b;
}

function multiply(a, b) {
  return a * b;
}

const PI = 3.14159;`
};

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function clearAll() {
  document.getElementById('inputA').value = '';
  document.getElementById('inputB').value = '';
  document.getElementById('diffOutput').style.display = 'none';
}

// Simple LCS-based diff
function computeDiff(a, b) {
  const linesA = a.split('\n');
  const linesB = b.split('\n');
  const m = linesA.length, n = linesB.length;

  // LCS table
  const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (linesA[i - 1] === linesB[j - 1]) {
        dp[i][j] = dp[i - 1][j - 1] + 1;
      } else {
        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
      }
    }
  }

  // Backtrack
  const result = [];
  let i = m, j = n;
  const temp = [];
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && linesA[i - 1] === linesB[j - 1]) {
      temp.push({ type: 'unchanged', text: linesA[i - 1], lnA: i, lnB: j });
      i--; j--;
    } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
      temp.push({ type: 'added', text: linesB[j - 1], lnA: null, lnB: j });
      j--;
    } else {
      temp.push({ type: 'removed', text: linesA[i - 1], lnA: i, lnB: null });
      i--;
    }
  }

  return temp.reverse();
}

function compare() {
  const textA = document.getElementById('inputA').value;
  const textB = document.getElementById('inputB').value;
  const output = document.getElementById('diffOutput');
  const lines = document.getElementById('diffLines');
  const stats = document.getElementById('diffStats');

  if (!textA && !textB) { showToast('Enter text in both fields', true); return; }

  const diffs = computeDiff(textA, textB);
  let added = 0, removed = 0;

  lines.innerHTML = diffs.map(d => {
    if (d.type === 'added') added++;
    if (d.type === 'removed') removed++;
    const lnStr = (d.lnA || '') + ':' + (d.lnB || '');
    return `<div class="diff-line ${d.type}"><span class="ln">${d.lnA || ''}:${d.lnB || ''}</span><span class="content">${escapeHtml(d.text) || ' '}</span></div>`;
  }).join('');

  stats.innerHTML = `<span class="added">+${added} added</span><span class="removed">-${removed} removed</span><span>${diffs.filter(d => d.type === 'unchanged').length} unchanged</span>`;
  output.style.display = 'block';
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function copyDiff() {
  const lines = document.getElementById('diffLines');
  const text = Array.from(lines.querySelectorAll('.diff-line')).map(line => {
    const type = line.classList.contains('added') ? '+' : line.classList.contains('removed') ? '-' : ' ';
    const content = line.querySelector('.content').textContent;
    return type + ' ' + content;
  }).join('\n');
  if (!text) { showToast('Nothing to copy', true); return; }
  navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    showToast('Copied to clipboard');
  });
}
</script>
</body>
</html>
