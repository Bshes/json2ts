<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UUID Generator - DevForge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
  .container { max-width: 800px; margin: 0 auto; padding: 20px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #30363d; }
  .logo { font-size: 24px; font-weight: 700; color: #58a6ff; }
  .logo span { color: #f0f6fc; }
  .back-link { color: #58a6ff; text-decoration: none; font-size: 13px; display: flex; align-items: center; gap: 4px; }
  .back-link:hover { text-decoration: underline; }
  .pro-badge { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; margin-top: 20px; }
  .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #1c2128; border-bottom: 1px solid #30363d; font-size: 14px; font-weight: 600; }
  .panel-header .actions { display: flex; gap: 8px; }
  .controls { display: flex; gap: 16px; padding: 16px; background: #1c2128; border-bottom: 1px solid #30363d; align-items: center; flex-wrap: wrap; }
  .controls label { font-size: 13px; color: #8b949e; display: flex; align-items: center; gap: 6px; }
  .controls input[type="number"] { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 4px 8px; color: #c9d1d9; font-size: 13px; width: 80px; outline: none; }
  .controls input[type="number"]:focus { border-color: #58a6ff; }
  .controls select { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 4px 8px; color: #c9d1d9; font-size: 13px; outline: none; }
  .uuid-list { padding: 0; margin: 0; list-style: none; }
  .uuid-list li { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid #30363d; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
  .uuid-list li:last-child { border-bottom: none; }
  .uuid-list li:hover { background: #1c2128; }
  .copy-btn { padding: 2px 8px; border-radius: 4px; border: 1px solid #30363d; background: transparent; color: #8b949e; cursor: pointer; font-size: 11px; transition: all .2s; }
  .copy-btn:hover { background: #30363d; color: #c9d1d9; }
  .btn { padding: 6px 16px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; cursor: pointer; font-size: 13px; transition: all .2s; }
  .btn:hover { background: #30363d; }
  .btn-primary { background: #238636; border-color: #2ea043; color: #fff; }
  .btn-primary:hover { background: #2ea043; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #238636; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .3s; z-index: 100; }
  .toast.show { opacity: 1; }
  .toast.error { background: #da3633; }
  .footer { text-align: center; padding: 32px 0; color: #484f58; font-size: 13px; }
  .footer a { color: #58a6ff; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <a href="../" class="back-link">← DevForge</a>
    <div class="logo">UUID <span>Generator</span></div>
    <span class="pro-badge">Free</span>
  </header>

  <div class="panel">
    <div class="panel-header">
      <span>Generate UUIDs</span>
      <div class="actions">
        <button class="btn btn-primary" onclick="generate()">Generate</button>
        <button class="btn" onclick="copyAll()">Copy All</button>
      </div>
    </div>
    <div class="controls">
      <label>Count: <input type="number" id="count" value="5" min="1" max="100"></label>
      <label>Version: <select id="version"><option value="v4">UUID v4 (Random)</option><option value="v1">UUID v1 (Time)</option></select></label>
      <label><input type="checkbox" id="uppercase"> Uppercase</label>
      <label><input type="checkbox" id="hyphens" checked> Hyphens</label>
    </div>
    <ul class="uuid-list" id="uuidList">
      <li style="color:#484f58;justify-content:center;padding:24px">Click Generate to create UUIDs</li>
    </ul>
  </div>

  <div class="footer">
    Built by <a href="https://dev.to/bshes">@Bshes</a> &mdash; <a href="../">All DevForge tools</a>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function generateUUIDv4() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function generateUUIDv1() {
  const now = new Date();
  const t = Math.floor(now.getTime() / 1000);
  const m = now.getMilliseconds() * 1000000;
  const clockSeq = (Math.random() * 0x3fff | 0);
  const node = Array.from({length: 6}, () => Math.floor(Math.random() * 256));
  const hex = n => n.toString(16).padStart(2, '0');
  return hex(t) + '-' + hex(m >> 16) + '-' + hex(m & 0xffff) + '-' + hex(clockSeq >> 8) + hex(clockSeq & 0xff) + '-' + node.map(hex).join('');
}

function generate() {
  const count = Math.min(Math.max(parseInt(document.getElementById('count').value) || 5, 1), 100);
  const version = document.getElementById('version').value;
  const upper = document.getElementById('uppercase').checked;
  const hyphens = document.getElementById('hyphens').checked;
  const list = document.getElementById('uuidList');
  const fn = version === 'v4' ? generateUUIDv4 : generateUUIDv1;

  const uuids = Array.from({length: count}, () => {
    let uuid = fn();
    if (!hyphens) uuid = uuid.replace(/-/g, '');
    if (upper) uuid = uuid.toUpperCase();
    return uuid;
  });

  list.innerHTML = uuids.map(uuid =>
    `<li><span>${uuid}</span><button class="copy-btn" onclick="copyUUID('${uuid}')">Copy</button></li>`
  ).join('');
  showToast(`Generated ${count} UUID${count > 1 ? 's' : ''}`);
}

function copyUUID(uuid) {
  navigator.clipboard.writeText(uuid).then(() => showToast('Copied: ' + uuid)).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = uuid; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    showToast('Copied: ' + uuid);
  });
}

function copyAll() {
  const items = document.querySelectorAll('#uuidList li span');
  const text = Array.from(items).map(s => s.textContent).join('\n');
  if (!text) { showToast('Nothing to copy', true); return; }
  navigator.clipboard.writeText(text).then(() => showToast('Copied all UUIDs')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    showToast('Copied all UUIDs');
  });
}

// Generate on load
generate();
</script>
</body>
</html>
